services:
  - type: web
    name: homeodesk-api
    env: node
    rootDir: homeodesk/server
    buildCommand: npm install
    startCommand: node index.js
    envVars:
      - key: PORT
        value: 5000
      - key: FRONTEND_ORIGIN
        sync: false
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: DOCTOR_EMAIL
        sync: false
      - key: DOCTOR_NAME
        sync: false
      - key: DOCTOR_PASSWORD
        sync: false
      - key: GEMINI_API_KEY
        sync: false
