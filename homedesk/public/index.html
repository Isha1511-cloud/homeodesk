<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.png" />
    <title>Dr. Isha's Homeopathic Clinic</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
      html { scroll-behavior: smooth; overflow-x: hidden; width: 100%; height: 100%; }
      body { font-family: 'Inter', sans-serif; background: #F8F5F0; overflow-x: hidden; width: 100%; min-height: 100%; -webkit-text-size-adjust: 100%; touch-action: manipulation; }
      #root { width: 100%; min-height: 100vh; overflow-x: hidden; }
      img, svg, video, canvas { max-width: 100%; height: auto; display: block; }
      input, select, textarea, button { max-width: 100%; box-sizing: border-box; font-family: inherit; }
      button { -webkit-tap-highlight-color: transparent; }
      p, h1, h2, h3, h4, h5, h6, span, a, label { overflow-wrap: break-word; }

      /* Sleek horizontal touch scroll for navigation tabs */
      .hd-scroll-x {
        overflow-x: auto;
        -webkit-overflow-scrolling: touch;
        scrollbar-width: none;
        -ms-overflow-style: none;
      }
      .hd-scroll-x::-webkit-scrollbar {
        display: none;
      }
      
      @media (max-width: 768px) {
        .hd-desktop-only { display: none !important; }
        .hd-mobile-only { display: block !important; }
        .hd-mobile-flex { display: flex !important; }
      }
      @media (min-width: 769px) {
        .hd-desktop-only { display: block !important; }
        .hd-desktop-flex { display: flex !important; }
        .hd-mobile-only { display: none !important; }
        .hd-mobile-flex { display: none !important; }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
